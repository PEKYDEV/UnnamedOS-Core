name: Bug report
description: Report a reproducible non-security defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include security vulnerabilities or sensitive data here.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic reproduction and relevant serial output.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit or release tested.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS, QEMU version, and OVMF source/version when relevant.
